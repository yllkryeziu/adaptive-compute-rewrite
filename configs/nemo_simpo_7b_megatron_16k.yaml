# SimPO Training Configuration for Qwen2.5-7B with Megatron
# Target: 16k sequence length on 1 node x 4 A100 40GB GPUs

simpo:
  max_num_epochs: 1
  max_num_steps: 500
  val_period: 100
  val_batches: 4
  val_global_batch_size: 8
  val_micro_batch_size: 1
  val_at_start: true
  seed: 42
  beta: 2.0
  gamma: 0.3
  preference_loss_weight: 1.0
  sft_loss_weight: 0.0

checkpointing:
  enabled: true
  checkpoint_dir: "results/nemo_simpo_7b_megatron_16k"
  metric_name: "val:validation-default_loss"
  higher_is_better: false
  keep_top_k: 2
  save_period: 100
  checkpoint_must_save_by: null

policy:
  model_name: "/p/project1/envcomp/yll/.cache/huggingface/hub/models--Qwen--Qwen2.5-7B-Instruct/snapshots/a09a35458c702b33eeacc393d103063234e8bc28"
  tokenizer:
    name: "/p/project1/envcomp/yll/.cache/huggingface/hub/models--Qwen--Qwen2.5-7B-Instruct/snapshots/a09a35458c702b33eeacc393d103063234e8bc28"
    chat_template_kwargs: null

  train_global_batch_size: 16       # Reduced from 32 for memory
  train_micro_batch_size: 1
  max_total_sequence_length: 16384  # 16k target
  precision: "bfloat16"
  offload_optimizer_for_logprob: false

  dtensor_cfg:
    enabled: false                   # Disable DTensor

  dynamic_batching:
    enabled: false

  sequence_packing:
    enabled: false

  make_sequence_length_divisible_by: 4
  max_grad_norm: 1.0

  megatron_cfg:
    enabled: true
    empty_unused_memory_level: 2

    # Parallelism for 7B on 1 node x 4 GPUs
    tensor_model_parallel_size: 4     # All 4 GPUs for TP
    pipeline_model_parallel_size: 1
    context_parallel_size: 1          # No CP needed for 7B
    sequence_parallel: true           # Key for memory savings

    activation_checkpointing: true

    pipeline_dtype: ${policy.precision}
    num_layers_in_first_pipeline_stage: null
    num_layers_in_last_pipeline_stage: null

    # MoE settings (not used)
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 1
    freeze_moe_router: false
    moe_router_dtype: "fp64"
    moe_router_load_balancing_type: "aux_loss"
    moe_router_bias_update_rate: 1e-3
    moe_permute_fusion: false
    moe_per_layer_logging: false

    # Performance optimizations
    apply_rope_fusion: true
    bias_activation_fusion: true
    defer_fp32_logits: false

    optimizer:
      optimizer: "adam"
      lr: 5.0e-7
      min_lr: 5.0e-8
      weight_decay: 0.1
      bf16: true
      fp16: false
      params_dtype: "float32"
      adam_beta1: 0.9
      adam_beta2: 0.98
      adam_eps: 1e-8
      use_distributed_optimizer: true
      use_precision_aware_optimizer: true
      clip_grad: ${policy.max_grad_norm}
      optimizer_cpu_offload: true       # Offload optimizer to CPU
      optimizer_offload_fraction: 1.0

    scheduler:
      start_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      end_weight_decay: ${policy.megatron_cfg.optimizer.weight_decay}
      weight_decay_incr_style: "constant"
      lr_decay_style: "cosine"
      lr_warmup_iters: 10
      lr_warmup_init: 5.0e-9

    distributed_data_parallel_config:
      grad_reduce_in_fp32: false
      overlap_grad_reduce: true
      overlap_param_gather: true
      data_parallel_sharding_strategy: "optim_grads_params"
      use_custom_fsdp: false

data:
  max_input_seq_length: ${policy.max_total_sequence_length}
  shuffle: true
  num_workers: 2
  dataset_name: BinaryPreferenceDataset
  train_data_path: "/p/project1/envcomp/yll/adaptive-compute-rewrite/data/nemo_simpo_data.jsonl"
  val_data_paths:
    default: "/p/project1/envcomp/yll/adaptive-compute-rewrite/data/nemo_simpo_data.jsonl"
  prompt_key: "prompt"
  chosen_key: "chosen"
  rejected_key: "rejected"

logger:
  log_dir: "logs/nemo_simpo_7b_megatron_16k"
  wandb_enabled: true
  wandb:
    project: "nemo-simpo"
    name: "qwen2.5-7b-megatron-16k-test"
  tensorboard_enabled: false
  mlflow_enabled: false
  swanlab_enabled: false
  monitor_gpus: true
  num_val_samples_to_print: 2
  gpu_monitoring:
    collection_interval: 10
    flush_interval: 10

cluster:
  gpus_per_node: 4
  num_nodes: 1
